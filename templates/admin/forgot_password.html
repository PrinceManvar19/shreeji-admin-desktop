{% extends 'base.html' %}

{% block title %}Forgot Password - Shreeji Auto Services{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo1.png') }}" class="auth-logo" alt="Shreeji Auto Services">
    <h2 class="auth-title">Reset <span>Password</span></h2>
    <p class="auth-subtitle">Enter the registered admin email to receive a six-digit reset code.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
      <label class="form-label" for="email">Admin Email *</label>
      <input class="form-control auth-input" id="email" name="email" type="email" autocomplete="email" required autofocus>
      <button type="submit" class="btn btn-primary w-100 auth-btn" data-loading-submit="true" data-loading-text="Sending code...">Send Reset Code</button>
    </form>

    <p style="text-align:center;margin-top:1rem;font-size:.9rem;">
      <a href="{{ url_for('auth.login') }}">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
