{% extends 'base.html' %}

{% block title %}Admin Login - Shreeji Auto Services{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo1.png') }}" class="auth-logo" alt="Shreeji Auto Services">
    <h2 class="auth-title">Admin <span>Login</span></h2>
    <p class="auth-subtitle">Sign in with your registered administrator email and password.</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <label class="form-label" for="email">Email *</label>
      <input class="form-control auth-input" id="email" name="email" type="email" autocomplete="username" required autofocus>

      <label class="form-label" for="password">Password *</label>
      <input class="form-control auth-input" id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit" class="btn btn-primary w-100 auth-btn" data-loading-submit="true" data-loading-text="Signing in...">Sign In</button>
    </form>

    <p style="text-align:center;margin-top:1rem;font-size:.9rem;">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
    </p>
  </div>
</div>
{% endblock %}
