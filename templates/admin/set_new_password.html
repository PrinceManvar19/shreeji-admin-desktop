{% extends 'base.html' %}

{% block title %}Set New Password - Shreeji Auto Services{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo1.png') }}" class="auth-logo" alt="Shreeji Auto Services">
    <h2 class="auth-title">New <span>Password</span></h2>
    <p class="auth-subtitle">Choose a password with at least eight characters.</p>

    <form method="POST" action="{{ url_for('auth.set_new_password') }}" class="auth-form">
      <label class="form-label" for="password">New Password *</label>
      <input class="form-control auth-input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required autofocus>

      <label class="form-label" for="confirm">Confirm Password *</label>
      <input class="form-control auth-input" id="confirm" name="confirm" type="password" minlength="8" autocomplete="new-password" required>

      <button type="submit" class="btn btn-primary w-100 auth-btn" data-loading-submit="true" data-loading-text="Updating...">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
