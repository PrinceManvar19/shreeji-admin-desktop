{% extends 'base.html' %}

{% block title %}Verify Reset Code - Shreeji Auto Services{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo1.png') }}" class="auth-logo" alt="Shreeji Auto Services">
    <h2 class="auth-title">Verify <span>Code</span></h2>
    <p class="auth-subtitle">Enter the six-digit reset code sent to {{ email }}.</p>

    <form method="POST" action="{{ url_for('auth.verify_reset_otp') }}" class="auth-form">
      <label class="form-label" for="otp">Reset Code *</label>
      <input class="form-control auth-input" id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
      <button type="submit" class="btn btn-primary w-100 auth-btn" data-loading-submit="true" data-loading-text="Verifying...">Verify Code</button>
    </form>

    <p style="text-align:center;margin-top:1rem;font-size:.9rem;">
      <a href="{{ url_for('auth.forgot_password') }}">Request a new code</a>
    </p>
  </div>
</div>
{% endblock %}
