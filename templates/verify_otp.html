{% extends 'base.html' %}

{% block title %}Verify OTP - Shreeji Auto Services{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo1.png') }}"
         class="auth-logo"
         alt="Logo">

    <h2 class="auth-title">
      Verify <span>OTP</span>
    </h2>

    <p class="auth-subtitle">
      Enter the one-time code sent to {{ email }}.
    </p>

    <form method="POST" action="{{ url_for('auth.desktop_verify_otp') }}" class="auth-form" id="otpForm">
      <label class="form-label" for="otp">OTP *</label>
      <input type="text" class="form-control auth-input" id="otp" name="otp" placeholder="123456" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" data-trim>

      <button type="submit" class="btn btn-primary w-100 auth-btn" data-loading-submit="true" data-loading-text="Verifying...">
        Verify OTP
      </button>
    </form>

    <p style="text-align:center;margin-top:1rem;font-size:0.9em;color:#666;">
      <a href="{{ url_for('auth.desktop_login') }}" style="color:#007bff;font-weight:500;">Request a new OTP</a>
    </p>
  </div>
</div>
{% endblock %}
